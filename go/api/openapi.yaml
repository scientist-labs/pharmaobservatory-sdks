  securitySchemes:
    ApiBearerJwt:
      bearerFormat: JWT
      description: "Bearer token issued for the REST API by WorkOS AuthKit. Discover\
        \ the authorization server and the scope via GET /.well-known/oauth-protected-resource/api/v1\
        \ (RFC 9728) before requesting a token, then run Authorization Code + PKCE\
        \ against that server and keep the refresh token (there is no client secret:\
        \ the application is a public PKCE client). A credential scoped to the MCP\
        \ mount does not authenticate here. NOTE: a deployment with no AuthKit domain\
        \ configured answers 503 no_identity_provider to every caller, because it\
        \ cannot verify a token at all."
      scheme: bearer
      type: http
