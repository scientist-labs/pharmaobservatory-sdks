openapi: 3.0.3
info:
  description: "Read-only REST API over the Pharma Observatory biomedical data platform.\
    \ Reference: https://pharmaobservatory.com/api-reference"
  title: Pharma Observatory Public REST API
  version: 1.0.0
servers:
- description: Production
  url: https://pharmaobservatory.com
paths:
  /api/v1/biomarkers:
    get:
      operationId: biomarkers.list
      parameters:
      - example: eyJwIjoyLCJsIjozLCJmIjoic3BlYy1maW5nZXJwcmludCJ9
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - example: asc
        explode: true
        in: query
        name: dir
        required: false
        schema:
          type: string
        style: form
      - example: 0
        explode: true
        in: query
        name: evidence
        required: false
        schema:
          type: integer
        style: form
      - example: true
        explode: true
        in: query
        name: facets
        required: false
        schema:
          type: boolean
        style: form
      - example: resolved
        explode: true
        in: query
        name: identity
        required: false
        schema:
          type: string
        style: form
      - example: gene
        explode: true
        in: query
        name: kind
        required: false
        schema:
          type: string
        style: form
      - example: 1
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - example: BRAF
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - example: name
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      - example: 1
        explode: true
        in: query
        name: validated
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/biomarkers_list_200_response'
          description: The Biomarkers section.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
          description: "answers 401 when the bearer token is missing, invalid, expired,\
            \ or scoped to the wrong audience (BearerJwtAuthentication#authenticate_bearer,\
            \ shared by every /api/v1 endpoint)"
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
          description: "answers 403 when the caller's token is valid but the account\
            \ has no product access yet (BearerJwtAuthentication#authorize_product_access,\
            \ shared by every /api/v1 endpoint)"
      security:
      - ApiBearerJwt: []
      summary: Biomarkers
      tags:
      - biomarkers
