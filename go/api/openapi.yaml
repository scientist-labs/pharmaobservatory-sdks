  /api/v1/conditions/{condition_id}/burden_vs_evidence:
    get:
      parameters:
      - example: D020521
        explode: false
        in: path
        name: condition_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                condition_id: D020521
                name: Stroke
                found: true
                dalys_m: 143.0
                trials: 1
                trials_per_m_daly: "0.01"
                rank: 1
                total_ranked: 27
                build_state:
                  built: true
                  generation: v0
                  last_loaded: null
                restriction:
                  tier: prohibited
                  license: GBD
                  attribution: IHME Global Burden of Disease 2021 (CC BY-NC 4.0).
                    Not commercially licensable at any price; non-commercial use only.
              schema:
                $ref: '#/components/schemas/_api_v1_conditions__condition_id__burden_vs_evidence_get_200_response'
          description: "returns the real GBD payload, with the restriction envelope,\
            \ once the caller holds the prohibited-tier data entitlement"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
          description: "answers 401 when the bearer token is missing, invalid, expired,\
            \ or scoped to the wrong audience (BearerJwtAuthentication#authenticate_bearer,\
            \ shared by every /api/v1 endpoint)"
        "403":
          content:
            application/json:
              example:
                error: not_entitled
                tier: prohibited
                license: GBD
                attribution: IHME Global Burden of Disease 2021 (CC BY-NC 4.0). Not
                  commercially licensable at any price; non-commercial use only.
              schema:
                $ref: '#/components/schemas/NotEntitledError'
          description: still refuses a non-entitled caller with a well-formed but
            non-matching condition_id (the backstop runs before the handler)
      security:
      - ApiBearerJwt: []
      summary: burden_vs_evidence
      tags:
      - Api::V1::Condition
