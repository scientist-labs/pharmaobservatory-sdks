openapi: 3.0.3
info:
  description: "Read-only REST API over the Pharma Observatory biomedical data platform.\
    \ Reference: https://pharmaobservatory.com/api-reference"
  title: Pharma Observatory Public REST API
  version: 1.0.0
servers:
- description: Production
  url: https://pharmaobservatory.com
paths:
  /api/v1/biomarkers:
    get:
      operationId: biomarkers.list
      parameters:
      - description: The next_cursor of the previous page. Opaque; it is bound to
          the filters and the warehouse build that issued it.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: "Rows per page, up to 500 (default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: "Comma separated columns, a leading minus for descending: sort=a,-b."
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      - description: "A dimension to group by; a date takes :year, :quarter or :month."
        explode: true
        in: query
        name: group_by
        required: false
        schema:
          type: string
        style: form
      - description: "count, sum(col), avg(col), min(col), max(col), median(col) or\
          \ count_distinct(col)."
        explode: true
        in: query
        name: measure
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiomarkersResponse'
          description: "The biomarkers dataset, filtered, sorted and paged. Filters:\
            \ {column}=v (repeat a key for IN), {column}.gt, .gte, .lt, .lte, .ne,\
            \ .contains (text), .null=true|false. sort=a,-b. group_by=dimension (a\
            \ date takes :year, :quarter or :month). measure=count, sum(col), avg(col),\
            \ min(col), max(col), median(col), count_distinct(col). cursor=next_cursor\
            \ of the previous page. limit up to 500, default 50. On company routes\
            \ scope=company|group. The columns, dimensions and measures of a dataset\
            \ are at GET /api/v1/datasets/{name}."
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
          description: answers 400 when the request names something the catalog does
            not declare (the body teaches the valid set)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
          description: "answers 401 when the bearer token is missing, invalid, expired,\
            \ or scoped to the wrong audience (BearerJwtAuthentication#authenticate_bearer,\
            \ shared by every /api/v1 endpoint)"
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
          description: "answers 403 when the caller's token is valid but the account\
            \ has no product access yet (BearerJwtAuthentication#authorize_product_access,\
            \ shared by every /api/v1 endpoint)"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
          description: answers 404 when the record or dataset does not exist
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
          description: answers 409 when the warehouse was rebuilt since the cursor
            was issued (GENERATION_CHANGED)
      security:
      - ApiBearerJwt: []
      summary: List biomarkers
      tags:
      - biomarkers
  /api/v1/biomarkers/{id}:
    get:
      operationId: biomarkers.get
      parameters:
      - example: ESR1
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiomarkersRecord'
          description: The record with its attribute rows folded in and the datasets
            reachable for it. counts=true also counts the rows each listed dataset
            holds for the record.
        "401":
          content:
