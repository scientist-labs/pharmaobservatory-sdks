            \ listing of the same site on the same trial carries a higher listing_ordinal).\
            \ Filters: {column}=v (repeat a key for IN), {column}.gt, .gte, .lt, .lte,\
            \ .ne, .contains (text), .null=true|false. sort=a,-b. group_by=dimension\
            \ (a date takes :year, :quarter or :month). measure=count, sum(col), avg(col),\
            \ min(col), max(col), median(col), count_distinct(col). cursor=next_cursor\
            \ of the previous page. limit up to 500, default 50. On company routes\
            \ scope=company|group. The columns, dimensions and measures of a dataset\
            \ are at GET /api/v1/datasets/{name}."
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
          description: answers 400 when the request names something the catalog does
            not declare (the body teaches the valid set)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
          description: "answers 401 when the bearer token is missing, invalid, expired,\
            \ or scoped to the wrong audience (BearerJwtAuthentication#authenticate_bearer,\
            \ shared by every /api/v1 endpoint)"
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
          description: "answers 403 when the caller's token is valid but the account\
            \ has no product access yet (BearerJwtAuthentication#authorize_product_access,\
            \ shared by every /api/v1 endpoint)"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
          description: answers 404 when the record or dataset does not exist
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
          description: answers 409 when the warehouse was rebuilt since the cursor
            was issued (GENERATION_CHANGED)
      security:
      - ApiBearerJwt: []
      summary: Trial sites
      tags:
      - trials
  /api/v1/whoami:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_v1_whoami_get_200_response'
          description: accepts a scope carrying other scopes alongside the REST API
            scope
        "401":
          content:
            application/json:
              example:
                error: invalid_audience
              schema:
                $ref: '#/components/schemas/AuthError'
          description: "answers 401 invalid_audience for a credential scoped ONLY\
            \ to the MCP mount, proving the mount binding gates independently per\
            \ mount"
        "403":
          content:
            application/json:
              example:
                error: access_pending
              schema:
                $ref: '#/components/schemas/AuthError'
          description: answers 403 access_pending for a token that names this mount
            but carries no product entry
      security:
      - ApiBearerJwt: []
      summary: whoami
      tags:
      - Api::V1::Base
