[package]
name = "pharmaobservatory"
version = "0.1.7"
authors = ["Scientist.com <support@scientist.com>"]
description = "Rust client for the Pharma Observatory public REST API (https://pharmaobservatory.com/api-reference)"
license = "MIT"
edition = "2021"
homepage = "https://pharmaobservatory.com"
repository = "https://github.com/scientist-labs/pharmaobservatory-sdks"
readme = "README.md"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
